name: MegaLinter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: MegaLinter
        id: ml
        uses: oxsecurity/megalinter/flavors/python@v8.8.0
        env:
          # Lint the full codebase on pushes to main, only the diff on PRs.
          VALIDATE_ALL_CODEBASE: ${{ github.event_name == 'push' }}
          # No automatic fixes: keeps fork PRs working and lint results advisory.
          APPLY_FIXES: none
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MegaLinter reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: megalinter-reports
          path: |
            megalinter-reports
            mega-linter.log
